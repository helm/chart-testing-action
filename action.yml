name: "Helm Chart Testing"
description: "Install the Helm chart-testing tool"
author: "The Helm authors"
branding:
  color: blue
  icon: anchor
inputs:
  version:
    description: "The chart-testing version to install"
    required: false
    default: '3.14.0'
  yamllint_version:
    description: "The yamllint version to install"
    required: false
    default: '1.33.0'
  yamale_version:
    description: "The yamale version to install"
    required: false
    default: '6.0.0'
  uv_version:
    description: "The uv version to install (default: latest)"
    required: false
    default: 'latest'
  github_token:
    description: "GitHub token for authenticating with the GitHub API (default: github.token)"
    required: false
    default: ${{ github.token }}
  lint_config:
    description: "Path to a custom yamllint config file. If set, ct lint uses it instead of the default lintconf.yaml."
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: ${{ inputs.uv_version }}
        github-token: ${{ inputs.github_token }}
    - run: |
        cd $GITHUB_ACTION_PATH \
        && ./ct.sh \
            --version ${{ inputs.version }} \
            --yamllint-version ${{ inputs.yamllint_version }} \
            --yamale-version ${{ inputs.yamale_version }}
      shell: bash
    - if: inputs.lint_config != ''
      env:
        LINT_CONFIG: ${{ inputs.lint_config }}
      run: |
        if [[ ! -f "${LINT_CONFIG}" ]]; then
          echo "::error::lint_config file not found: ${LINT_CONFIG}"
          exit 1
        fi
        echo "CT_LINT_CONF=$(realpath "${LINT_CONFIG}")" >> "${GITHUB_ENV}"
        echo "Using custom yamllint config: ${LINT_CONFIG}"
      shell: bash
