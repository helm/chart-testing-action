name: "Helm Chart Testing"
description: "Install the Helm chart-testing tool"
author: "The Helm authors"
branding:
  color: blue
  icon: anchor
inputs:
  version:
    description: "The chart-testing version to install"
    required: false
    default: '3.14.0'
  yamllint_version:
    description: "The yamllint version to install"
    required: false
    default: '1.33.0'
  yamale_version:
    description: "The yamale version to install"
    required: false
    default: '6.0.0'
  uv_version:
    description: "The uv version to install (default: latest)"
    required: false
    default: 'latest'
  github_token:
    description: "GitHub token for authenticating with the GitHub API (default: github.token)"
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ inputs.uv_version }}
        github-token: ${{ inputs.github_token }}
    - run: |
        cd "$GITHUB_ACTION_PATH" \
        && ./ct.sh \
            --version "$CHART_TESTING_VERSION" \
            --yamllint-version "$YAMLLINT_VERSION" \
            --yamale-version "$YAMALE_VERSION"
      shell: bash
      env:
        CHART_TESTING_VERSION: ${{ inputs.version }}
        YAMLLINT_VERSION: ${{ inputs.yamllint_version }}
        YAMALE_VERSION: ${{ inputs.yamale_version }}
